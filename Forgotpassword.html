<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quên Mật Khẩu</title>
    <link rel="stylesheet" href="login.css" />
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            <div class="logo-container">
                <img src="image/Logo.jpg" alt="" class="logo">
            </div>
            <h2>Forgot Password</h2>
            <p>Nhập địa chỉ Email đã liên kết </p>
            <form id="forgotForm" action="#" method="post">
                <label for="email"></label>
                <input type="email" id="email" placeholder="Email address" required/>
                <button type="submit" class="btn-primary">Send reset Link</button>
            </form>
            <div class="divider">or</div>
            <div class="social-login">
                <button class="google-btn"> <img src="image/icons8-google-48.png" alt="Google logo">Continue with google</button>

                <button class="facebook-btn">
                    <img src="image/icons8-facebook-48.png" alt="Facebook logo">Continue with facebook
                </button>

            </div>
            <p class="signup-text">
                Remember your password ? <a href="Login.html"> Login</a>
            </p>
        </div>
    </div>
    <script >
        function showAlert(msg){
            alert(msg);
        }
        function redirect(url){
            window.location.href = url;
        }
        if (document.title.includes("Quên Mật Khẩu")){
            const form = document.querySelector("form");
            if (form) {
                form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const email = form.querySelector('input[type="email"]').value.trim();
                    if (!email){
                        showAlert("Vui lòng nhập email để khôi phục mật khẩu");
                        return;
                    }
                    showAlert(`Liên kết khôi phục mật khẩu đã được gửi đến ${email}`);
                    redirect("Login.html");
                })
            }
        }
    </script>
</body>
</html>
