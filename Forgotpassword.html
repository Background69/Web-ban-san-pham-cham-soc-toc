<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="login.css" />
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <div class="logo">
                <img src="image/icons8-phone-48.png" alt="" />
            </div>
            <h2>Forgot Password</h2>
            <p2>Nhập địa chỉ Email đã liên kết </p2>
            <form action="#" method="post">
                <label forHtml="email">Email address</label>
                <input type="email" id="email" placeholder="Email address" required/>
                <button type="submit" class="btn-primary">Send reset Link</button>
            </form>
            <div class="driver">or</div>
            <div class="social-login">
                <button class="google-btn"> <img src="image/icons8-google-48.png" alt="Google logo">Continue with google</button>

                <button class="facebook-btn">
                    <img src="image/icons8-facebook-48.png" alt="Facebook logo">Continue with facebook
                </button>

            </div>
            <p class="signup-text">
                Remember your password ? <a href="Login.html"> Login</a>
            </p>
        </div>
    </div>
</body>
</html>
