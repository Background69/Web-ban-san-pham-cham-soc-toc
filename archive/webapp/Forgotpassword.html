<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Quên Mật Khẩu</title>
    <link href="css/login.css" rel="stylesheet"/>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">
        <div class="logo-container">
            <img alt="" class="logo" src="assets/LOGO.png">
        </div>
        <h2>Quên mật nhẩu</h2>
        <p>Nhập địa chỉ Email đã liên kết </p>
        <form action="#" id="forgotForm" method="post">
            <label for="email"></label>
            <input id="email" placeholder="Email address" required type="email"/>
            <button class="btn-primary" type="submit">Gửi link đặt lại mật khẩu</button>
        </form>


        <p class="signup-text">
            Còn nhớ mật khẩu?<a href="Login.html">Đăng nhập ngay!</a>
        </p>
    </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
