<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quản lí người dùng</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/user.css">
</head>
<body>
<header class="header">
    <div class="header-left">
        <img src="image/Logo.jpg" alt="Logo" class="logo">
        <h2>Hồ sơ người dùng</h2>
    </div>

    <div class="header-right">
        <div class="search-box">
            <input type="text" placeholder="Search user...">
            <button><i class="fa fa-search"></i></button>
        </div>
        <img src="image/avatar.jpg" alt="avatar" class="avatar-small">
    </div>
</header>
<div class="profile-card">
    <div class="profile-header">
        <h2>Welcome vanthang</h2>
        <button class="edit-btn">Edit</button>
    </div>
    <div class="profile-info">
        <div class="profile-left">
            <img src="image/avatar.jpg" alt="avt">
            <h3>Vanthang</h3>
            <p>My email address</p>
            <div class="email-box">
                <i class="fa-solid fa-envelope"></i>
                19130201@st.hcmuaf.edu.vn
            </div>
        </div>
        <div class="add-email">
            <i class="fa-solid fa-plus"></i> Add Email Address
        </div>
    </div>
    <div class="profile-right">
        <div class="form-grid">
            <div>
                <label>Full name</label>
                <input type="text" placeholder="your first name">
            </div>
            <label>Nick name</label>
            <input type="text" placeholder="your nick name">
        </div>
        <div>
            <label>Gender</label>
            <select>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>

            </select>
        </div>
        <div>
            <label>Country</label>
            <select>
                <option value="">Viet nam</option>
                <option value="">Japan</option>
                <option value="">USA</option>
                <option value="">france</option>
            </select>
        </div>
        <div>
            <label>Language</label>
            <select>
                <option value="">Viet nam</option>
                <option value="">Japan</option>
                <option value="">USA</option>
                <option value="">france</option>
            </select>
        </div>
        <div>
            <label>TimeZone</label>
            <input type="text" placeholder="GMT + 7:00">
        </div>
        <button class="save-btn">SAVE</button>
    </div>

</div>
<div class="add-email">
    <i class="fa-solid fa-plus"></i> Add Email Address
</div>


</div>

</body>
</html>
