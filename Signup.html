<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Singup</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-box">
        <div class="logo">
            <img src="image/icons8-phone-48.png" alt="" class="logo">
        </div>
        <h2>Sign Up</h2>
        <p>Tạo tài khoản mới để tiếp tục</p>
        <form action="#" method="post">
            <label forHtml="Fullname">Full Name</label>
            <input type="text" id="Fullname" name="Fullname" placeholder="Enter your name" required>
            <label forHtml="Gmail">Email address</label>
            <input type="email" id="Email" name="Email" placeholder="Enter your email" required>
            <label forHtml="Password">Password</label>
            <input type="password" id="Password" name="Password" placeholder="Enter your password" required>
            <label forHtml="Confirm password">Confirm password</label>
            <input type="password" id="Confirm password" name="Confirm password" placeholder="Confirm password" required>
            <button type="submid" class="btn-primary">Sign Up</button>

        </form>
        <div class="driver">or</div>
        <div class="social-login">
            <button class="google-btn"> <img src="image/icons8-google-48.png" alt="Google logo">Continue with google</button>

            <button class="facebook-btn">
                <img src="image/icons8-facebook-48.png" alt="Facebook logo">Continue with facebook</button>

        </div>
        <p class="signup-text">
            Already have an account? <a href="Login.html">Login</a>
        </p>
    </div>
</div>
</body>
</html>
