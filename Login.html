<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-box">
        <img  src="image/icons8-phone-48.png" alt="" class="logo">
        <h1>Login</h1>
        <p class="subtitle">Tiếp tục để mua </p>
        <form>
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="Email address" required>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            <div class="options">
                <label><input type="checkbox">Remember me</label>
                <a href="Forgotpassword.html" class="forgot">Forgot password</a>
            </div>
            <button type="submit" class="btn primary-btn">Sign In</button>
            <div class="or">or</div>
            <button type="button" class="btn google-btn">
                <img src="/image/icons8-google-48.png" width="30px" height="30px" alt="Google Icon">   Continue with Google
            </button>
            <button type="button" class="btn apple-btn">
                <img src="image/icons8-facebook-48.png" width="30px" height="30px" alt="Apple Icon">   Continue with FaceBook
            </button>

        </form>

        <p class="signup-text">
            Don't have an account? <a href="Signup.html">Sign up</a>
        </p>
    </div>
</div>


<script src="login.js"></script>



</body>
</html>
