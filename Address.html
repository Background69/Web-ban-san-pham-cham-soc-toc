<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="address.css">
    <title>Địa chỉ</title>
</head>
<body>
    <div class="cart-process">
    <div class="cart-checkout-process">
      <i class="fa-solid fa-cart-shopping"></i>
    </div>
    <div class="cart-checkout-process">
      <i class="fa-solid fa-location-dot"></i>
    </div>
    <div class="cart-checkout-process">
      <i class="fa-solid fa-credit-card"></i>
    </div>
  </div>
    <div class="address-container">
        <div class="address-left">
        <h3>Địa chỉ giao hàng</h3>
        <form class="address-form">
            <label>Họ và tên</label>
            <input type="text" name="fullname" required>

            <label id="phonenumber">Số điện thoại</label>
            <input type="number" name="phonenumber" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Tỉnh/Thành phố</label>
            <select name = "province"></select>

            <label>Quận/Huyện</label>
            <select name = "district"></select>

            <label>Phường/Xã</label>
            <select name = "ward"></select>

            <label>Địa chỉ cụ thể (Tên đường, khu phố)</label>
            <input type="text" name="specificaddress" required>

            <label>Ghi chú</label>
            <textarea name="note" rows="4"></textarea>

            <h3>Phương thức giao hàng</h3>

            <label class="shipping-option">
            <input type="radio" name="shipping" value="standard" checked>
            Giao hàng tiêu chuẩn (30.000 VNĐ) - Dự kiến nhận hàng trong 5-7 ngày
            </label>

            <label class="shipping-option">
            <input type="radio" name="shipping" value="express">
            Giao hàng nhanh (40.000 VNĐ) - Dự kiến nhận hàng trong 1-3 ngày
            </label>
        </form>
    </div>
    <div class="address-right">
        <h3>Tóm tắt đơn hàng</h3>
        <div class="order-summary">
            <div class="summary-item">
                <span>Tạm tính:</span>
                <span class="summary-value" id="subtotal">0 VNĐ</span>
            </div>
            <div class="summary-item">
                <span>Phí vận chuyển:</span>
                <span class="summary-value" id="shipping-fee">0 VNĐ</span>
            </div>
            <div class="summary-item total">
                <span>Tổng cộng:</span>
                <span class="summary-value" id="total-amount">0 VNĐ</span>
            </div>
        </div>
        <button class="proceed-payment-btn">Tiếp theo</button>
    </div>
    <script> const provinceSelect =document.querySelector('select[name="province"]');
            const districtSelect = document.querySelector('select[name="district"]');
            const wardSelect = document.querySelector('select[name="ward"]');

            fetch('https://provinces.open-api.vn/api/p/')
            .then(response => response.json())
            .then(provinces => {
                provinceSelect.innerHTML = '<option value="">Chọn Tỉnh/Thành phố</option>';
                provinces.forEach(province => {
                    const option = document.createElement('option');
                    option.value = province.code;
                    option.textContent = province.name;
                    provinceSelect.appendChild(option);
                });
            });
            provinceSelect.addEventListener('change', () => {
                const provinceCode = provinceSelect.value;
                districtSelect.innerHTML = '<option value="">Chọn Quận/Huyện</option>';
                wardSelect.innerHTML = '<option value="">Chọn Phường/Xã</option>';
                if (provinceCode) {
                    fetch(`https://provinces.open-api.vn/api/p/${provinceCode}?depth=2`)
                    .then(response => response.json())
                    .then(province => {
                        province.districts.forEach(district => {
                            const option = document.createElement('option');
                            option.value = district.code;
                            option.textContent = district.name;
                            districtSelect.appendChild(option);
                        });
                    });
                }
            });
    </script>
</body>
</html>
