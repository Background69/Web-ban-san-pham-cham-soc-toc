<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quên Mật Khẩu</title>
    <link href="css/login.css" rel="stylesheet"/>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">
        <div class="logo-container">
            <img alt="" class="logo" src="assets/Logo.jpg">
        </div>
        <h2>Forgot Password</h2>
        <p>Nhập địa chỉ Email đã liên kết </p>
        <form action="#" id="forgotForm" method="post">
            <label for="email"></label>
            <input id="email" placeholder="Email address" required type="email"/>
            <button class="btn-primary" type="submit">Send reset Link</button>
        </form>
        <div class="divider">or</div>
        <div class="social-login">
            <button class="google-btn"><img alt="Google logo" src="assets/icons8-google-48.png">Continue with google
            </button>

            <button class="facebook-btn">
                <img alt="Facebook logo" src="assets/icons8-facebook-48.png">Continue with facebook
            </button>

        </div>
        <p class="signup-text">
            Remember your password ? <a href="Login.html"> Login</a>
        </p>
    </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
