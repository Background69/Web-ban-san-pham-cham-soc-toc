<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quản lí người dùng</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/user.css">
</head>
<body>
<header class="header">
    <div class="header-left">
        <img src="assets/LOGO.PNG" alt="Logo" class="logo">
        <h2>Hồ sơ người dùng</h2>
    </div>

    <div class="header-right">
        <div class="search-box">
            <input type="text" placeholder="Search user...">
            <button><i class="fa fa-search"></i></button>
        </div>
        <img src="images/avatar.jpg" alt="avatar" class="avatar-small">
    </div>
</header>
<div class="profile-card">
    <div class="profile-header">
        <h2>Xin Chào vanthang</h2>
        <button class="edit-btn">Edit</button>
    </div>
    <div class="profile-info">
        <div class="profile-left">
            <img src="images/avatar.jpg" alt="avt">
            <h3>Vanthang</h3>
            <p>My email address</p>
            <div class="email-box">
                <i class="fa-solid fa-envelope"></i>
                19130201@st.hcmuaf.edu.vn
            </div>
        </div>
        <div class="add-email">
            <i class="fa-solid fa-plus"></i> Add Email Address
        </div>
    </div>
    <div class="profile-right">
        <div>
            <label>Tên đầy đủ</label>
            <input type="text" placeholder="họ và tên ">
        </div>

        <div>
            <label>Tên người dùng</label>
            <input type="text" placeholder="tên người dùng">
        </div>

        <div>
            <label>Giới tính</label>
            <select>
                <option value="male">Nữ</option>
                <option value="female">Nam</option>
                <option value="other">Khác</option>
            </select>
        </div>

        <div>
            <label>Vai trò</label>
            <select>
                <option value="Admin">Admin</option>
                <option value="Editor">Editor</option>
                <option value="Subscriber">Subscriber</option>
            </select>
        </div>

        <button class="save-btn">SAVE</button>
    </div>


</div>
<div class="add-email">
    <i class="fa-solid fa-plus"></i> Add Email Address
</div>


</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const editBtn = document.querySelector(".edit-btn");
        const saveBtn = document.querySelector(".save-btn");
        const inputs = document.querySelectorAll("input, select");
        inputs.forEach(el => el.disabled = true);
        editBtn.addEventListener("click", function () {
            inputs.forEach(el => el.disabled = false );
        });
        saveBtn.addEventListener("click", function () {
            inputs.forEach(el => el.disabled = true);
            alert("Thông tin đã được lưu thành công!");
            window.location.href = "Login.html"; // Chuyển sang trang chủ
        });

    })
</script>
</body>
</html>
